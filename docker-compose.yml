services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  spark-master:
    build:
      context: ./spark
    image: f1-spark:3.5.9
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data

  spark-worker:
    build:
      context: ./spark
    image: f1-spark:3.5.9
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "2G", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data

  jupyter:
    build:
      context: ./notebooks
    ports:
      # Tylko localhost - staly token nie jest wystawiony na siec lokalna.
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
      # _spark_metadata ze streamingu zawiera absolutne sciezki /opt/data/...
      # (jak w kontenerach Sparka) - bez tego Spark w notebooku nie znajdzie plikow.
      - ./data:/opt/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      # Staly token (nie zmienia sie po restarcie kontenera). Mozna go nadpisac
      # w pliku .env: JUPYTER_TOKEN=...
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-f1-local}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  # Pobieranie danych FastF1 -> data/raw/fastf1. Nie startuje z "docker compose up",
  # uruchamiane recznie: docker compose run --rm ingest
  ingest:
    build:
      context: ./ingest
    profiles: ["tools"]
    volumes:
      - ./data:/data
    environment:
      - SEASON=2026

  producer:
    build:
      context: ./producer
    depends_on:
      - kafka
    restart: on-failure
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=f1-telemetry
